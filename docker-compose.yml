# Local proof of concept. Everything binds to 127.0.0.1; expose only the
# middleware to Retell through a tunnel (ngrok / cloudflared), never Postgres.
name: payer-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: payer_ai
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payer_ai"]
      interval: 3s
      retries: 20

  mock-facets:
    build: ./mock-facets
    environment:
      FACETS_GATEWAY_KEY: ${FACETS_GATEWAY_KEY:-dev-facets-gateway-key}
      FACETS_SIMULATED_LATENCY_MS: ${FACETS_SIMULATED_LATENCY_MS:-120}
      FACETS_SIMULATED_FAILURE_RATE: ${FACETS_SIMULATED_FAILURE_RATE:-0}
    ports:
      - "127.0.0.1:8001:8001"

  middleware:
    build: ./middleware
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://payer_app:${APP_DB_PASSWORD}@postgres:5432/payer_ai
      FACETS_BASE_URL: http://mock-facets:8001
    depends_on:
      postgres:
        condition: service_healthy
      mock-facets:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - middleware
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
